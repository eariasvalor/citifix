spring.application.name=citifix

# --- DATABASE CONFIG ---
spring.datasource.url=jdbc:postgresql://localhost:5432/citifix_db
spring.datasource.username=citifix_user
spring.datasource.password=citifix_pass
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- CLOUDINARY CONFIG ---
# Replace these values with your credentials from https://cloudinary.com/console
cloudinary.cloud-name=test-cloud
cloudinary.api-key=123456789
cloudinary.api-secret=test-secret


# --- FILE UPLOAD LIMITS ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- HEALTH CHECK ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# --- ERROR DEBUGGING ---
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
logging.level.org.springdoc=DEBUG

# --- SWAGGER CONFIG ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.web=DEBUG