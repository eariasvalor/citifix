spring.application.name=citifix

# --- SERVER (Render uses PORT) ---
server.port=${PORT:8080}

# --- DATABASE CONFIG (overridable by env vars) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/citifix_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:citifix_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:citifix_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Defaults SAFE-ish for local dev (override in prod via env)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL init: default only in dev; override in prod
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.jpa.defer-datasource-initialization=true

# --- CLOUDINARY CONFIG ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# --- FILE UPLOAD LIMITS ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- HEALTH CHECK ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:always}
management.endpoint.health.probes.enabled=true

# --- ERROR DEBUGGING (override in prod) ---
server.error.include-message=${SERVER_ERROR_INCLUDE_MESSAGE:always}
server.error.include-binding-errors=${SERVER_ERROR_INCLUDE_BINDING_ERRORS:always}
server.error.include-stacktrace=${SERVER_ERROR_INCLUDE_STACKTRACE:always}

# --- SWAGGER CONFIG ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# --- LOGGING (override in prod) ---
logging.level.org.springdoc=${LOGGING_LEVEL_SPRINGDOC:DEBUG}
logging.level.org.springframework.security=${LOGGING_LEVEL_SPRING_SECURITY:DEBUG}
logging.level.org.springframework.security.web.FilterChainProxy=${LOGGING_LEVEL_FILTERCHAIN:DEBUG}
logging.level.org.springframework.web=${LOGGING_LEVEL_SPRING_WEB:DEBUG}

# (Opcional) CORS origins externalized (si lo usas en tu config)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
